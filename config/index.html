<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>响应模型名称 · Magpie 插件</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">MAGPIE / RESPONSE MODEL</span><h1>响应模型名称</h1><p>选择客户端收到的模型名称。实际调用的模型保持不变。</p></header>
    <section class="panel" aria-label="模型配置">
      <div class="section-head"><h2>选择模型</h2><button id="refresh" type="button">刷新模型列表</button></div>
      <label for="search">搜索名称或 ID</label>
      <input id="search" type="search" placeholder="例如 gpt、claude" autocomplete="off" disabled>
      <label for="model">返回给客户端的模型 ID</label>
      <select id="model" disabled aria-describedby="model-note"><option value="">保留原模型名称</option></select>
      <p class="hint" id="model-note">从本机网关读取可用模型。已保存但未列出的名称也会保留。</p>
      <div class="current"><span>已保存的名称</span><code id="current">正在读取…</code></div>
      <div class="actions"><button id="save" class="primary" type="button" disabled>保存配置</button><button id="reset" type="button" disabled>取消修改</button></div>
      <p id="status" role="status" aria-live="polite">正在读取配置…</p>
      <p id="models-status" role="status" aria-live="polite"></p>
    </section>
    <footer><p id="connection">本机配置页面</p><p>保存后从新的请求起生效。此页面不修改 Magpie 主程序。</p></footer>
  </main>
</body>
</html>
